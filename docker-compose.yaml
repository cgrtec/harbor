services:
  harbor-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harbor-web
    restart: unless-stopped
    # [HERMES] puertos en LAN+localhost para convivir con tailscale serve :1420
    ports:
      - "127.0.0.1:1420:1420"
      - "192.168.0.127:1420:1420"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    tty: true
    stdin_open: true
